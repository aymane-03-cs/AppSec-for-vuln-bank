name: Security Nightly Scan

# Nightly full scan.
# Snyk already scans the repo continuously via its GitHub integration.
# This workflow runs the open-source backups on a schedule and can optionally
# run Snyk CLI if you want SARIF exports from Snyk in GitHub.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: vuln-bank

jobs:
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/gitleaks/gitleaks.toml
        continue-on-error: true

  sast-semgrep:
    name: SAST - Semgrep Backup
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config=security/semgrep/semgrep-config.yml \
                  --config=p/python \
                  --config=p/owasp-top-ten \
                  --config=p/cwe-top-25 \
                  --sarif-output=semgrep-results.sarif \
                  --error
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-nightly

      - name: Upload Semgrep report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results-nightly
          path: semgrep-results.sarif

  sca-pip-audit:
    name: SCA - pip-audit Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --requirement=requirements.txt \
                    --format=json \
                    --output=pip-audit-results.json \
                    --desc || true

      - name: Convert pip-audit JSON to SARIF
        run: python security/scripts/pip-audit-to-sarif.py
        continue-on-error: true

      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit-nightly

      - name: Upload pip-audit report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results-nightly
          path: |
            pip-audit-results.json
            pip-audit-results.sarif

  image-hadolint:
    name: Image - Hadolint Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: security/hadolint.yml
          format: sarif
          output: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-nightly

      - name: Upload Hadolint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-results-nightly
          path: hadolint-results.sarif

  image-trivy:
    name: Image - Trivy Backup Scan
    runs-on: ubuntu-latest
    needs: image-hadolint
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          exit-code: '0'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          trivyignores: security/trivy/.trivyignore

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-nightly

      - name: Upload Trivy image report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-results-nightly
          path: trivy-image-results.sarif

  iac-checkov:
    name: IaC - Checkov Backup
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov --file Dockerfile \
                  --file docker-compose.yml \
                  --config-file security/checkov-config.yml \
                  --output sarif \
                  --output-file-path checkov-results.sarif \
                  --soft-fail

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov-nightly

      - name: Upload Checkov report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results-nightly
          path: checkov-results.sarif

  # ---------------------------------------------------------------------------
  # Optional Snyk CLI export to SARIF.
  # Only runs if you set the SNYK_TOKEN secret and want Snyk results in the
  # GitHub Security tab alongside the other tools.
  # ---------------------------------------------------------------------------
  snyk-sca:
    name: Snyk - Open Source SARIF Export
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --sarif-file-output=snyk-sca-results.sarif || true

      - name: Upload Snyk SCA SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-sca-results.sarif
          category: snyk-sca

      - name: Upload Snyk SCA report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sca-results
          path: snyk-sca-results.sarif

  snyk-container:
    name: Snyk - Container SARIF Export
    runs-on: ubuntu-latest
    needs: image-hadolint
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      - name: Set up Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk container test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test ${{ env.IMAGE_NAME }}:ci --file=Dockerfile --sarif-file-output=snyk-container-results.sarif || true

      - name: Upload Snyk container SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-container-results.sarif
          category: snyk-container

      - name: Upload Snyk container report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-container-results
          path: snyk-container-results.sarif

  runtime-smoke:
    name: Runtime Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/healthz; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to become healthy"
          docker compose logs
          exit 1

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast-semgrep
      - sca-pip-audit
      - image-hadolint
      - image-trivy
      - iac-checkov
      - runtime-smoke
    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Print summary
        run: |
          echo "### Nightly security scan report" >> $GITHUB_STEP_SUMMARY
          echo "Snyk (primary) runs via the GitHub integration." >> $GITHUB_STEP_SUMMARY
          echo "Open-source backups run in CI for local reproducibility." >> $GITHUB_STEP_SUMMARY
          echo "All jobs are non-blocking while you build a baseline." >> $GITHUB_STEP_SUMMARY
